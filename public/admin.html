<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Update Results</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0a0e17; color: #e0e0e0; padding: 2rem; }
    h1 { margin-bottom: 1rem; }
    h2 { margin: 1.5rem 0 0.75rem; color: #888; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .auth { margin-bottom: 2rem; display: flex; gap: 0.5rem; align-items: center; }
    .auth input { padding: 0.5rem 0.75rem; background: #151a2e; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 0.9rem; }
    .match-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; font-size: 0.9rem; }
    .match-row .label { min-width: 320px; color: #aaa; }
    .match-row select { padding: 0.4rem; background: #151a2e; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.85rem; }
    button.save { margin-top: 1.5rem; padding: 0.6rem 2rem; background: #8b1a1a; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    button.save:hover { background: #a52020; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 0.9rem; z-index: 100; animation: fadeInOut 3s ease forwards; }
    .toast.ok { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
    .toast.err { background: #3a1a1a; color: #f44336; border: 1px solid #f44336; }
    @keyframes fadeInOut {
      0% { opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; }
    }
    a { color: #8b9dc3; }
  </style>
</head>
<body>
  <h1>🔧 Admin — Update Results</h1>
  <p style="margin-bottom:1rem"><a href="/">&larr; Back to bracket</a></p>
  <div class="auth">
    <label>Password:</label>
    <input type="password" id="password" placeholder="Admin password">
  </div>
  <div id="rounds"></div>
  <button class="save" onclick="saveResults()">Save Results</button>

  <script>
    let teams = [];
    let currentResults = {};

    async function init() {
      const [teamsData, resultsData] = await Promise.all([
        fetch('/api/teams').then(r => r.json()),
        fetch('/api/results').then(r => r.json())
      ]);
      teams = teamsData.matches;
      currentResults = resultsData;
      render();
    }

    function render() {
      const container = document.getElementById('rounds');
      container.innerHTML = '';

      // Round of 32
      container.innerHTML += '<h2>Round of 32</h2>';
      teams.forEach(m => {
        container.appendChild(makeRow('round32', m.id, m.team1, m.team2));
      });

      // Round of 16
      container.innerHTML += '<h2>Round of 16</h2>';
      for (let i = 1; i <= 8; i++) {
        const t1 = currentResults.round32?.[i * 2 - 1] || '?';
        const t2 = currentResults.round32?.[i * 2] || '?';
        container.appendChild(makeRow('round16', i, t1, t2));
      }

      // Quarters
      container.innerHTML += '<h2>Quarterfinals</h2>';
      for (let i = 1; i <= 4; i++) {
        const t1 = currentResults.round16?.[i * 2 - 1] || '?';
        const t2 = currentResults.round16?.[i * 2] || '?';
        container.appendChild(makeRow('quarters', i, t1, t2));
      }

      // Semis
      container.innerHTML += '<h2>Semifinals</h2>';
      for (let i = 1; i <= 2; i++) {
        const t1 = currentResults.quarters?.[i * 2 - 1] || '?';
        const t2 = currentResults.quarters?.[i * 2] || '?';
        container.appendChild(makeRow('semis', i, t1, t2));
      }

      // Final
      container.innerHTML += '<h2>Final</h2>';
      const f1 = currentResults.semis?.[1] || '?';
      const f2 = currentResults.semis?.[2] || '?';
      container.appendChild(makeRow('final', 1, f1, f2));

      // Champion
      container.innerHTML += '<h2>Champion</h2>';
      const champRow = document.createElement('div');
      champRow.className = 'match-row';
      champRow.innerHTML = `<span class="label">Tournament Winner</span>`;
      const sel = document.createElement('select');
      sel.id = 'champion-select';
      sel.innerHTML = '<option value="">—</option>';
      if (currentResults.final?.[1]) {
        sel.innerHTML += `<option value="${currentResults.final[1]}">${currentResults.final[1]}</option>`;
      }
      const fLoser = [f1, f2].find(t => t !== currentResults.final?.[1]);
      if (fLoser && fLoser !== '?' && currentResults.final?.[1]) {
        // only show the final winner as champion option
      }
      if (currentResults.champion) sel.value = currentResults.champion;
      champRow.appendChild(sel);
      container.appendChild(champRow);
    }

    function makeRow(round, matchId, team1, team2) {
      const row = document.createElement('div');
      row.className = 'match-row';

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = `#${matchId}: ${team1} vs ${team2}`;

      const sel = document.createElement('select');
      sel.dataset.round = round;
      sel.dataset.match = matchId;

      sel.innerHTML = '<option value="">—</option>';
      if (team1 && team1 !== '?') sel.innerHTML += `<option value="${team1}">${team1}</option>`;
      if (team2 && team2 !== '?') sel.innerHTML += `<option value="${team2}">${team2}</option>`;

      const current = currentResults[round]?.[matchId];
      if (current) sel.value = current;

      sel.addEventListener('change', () => {
        if (!currentResults[round]) currentResults[round] = {};
        if (sel.value) {
          currentResults[round][matchId] = sel.value;
        } else {
          delete currentResults[round][matchId];
        }
        render();
      });

      row.appendChild(label);
      row.appendChild(sel);
      return row;
    }

    async function saveResults() {
      const password = document.getElementById('password').value;
      if (!password) { toast('Enter the admin password', true); return; }

      const champion = document.getElementById('champion-select')?.value || null;
      currentResults.champion = champion;

      const res = await fetch('/api/results', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, results: currentResults })
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error, true); return; }
      toast('Results saved!');
    }

    function toast(msg, isErr) {
      const t = document.createElement('div');
      t.className = 'toast ' + (isErr ? 'err' : 'ok');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    init();
  </script>
</body>
</html>
